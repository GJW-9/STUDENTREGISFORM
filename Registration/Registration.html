<!DOCTYPE html>
<html lang="en">
     <head>
          <link rel="icon" href="/pot/blockprint-lesson-arithmetic.svg">
          <title>"Student Registration"</title>
     </head>
     <body>
          
          <link rel="stylesheet" href="Registration.css">


          <h1>STUDENT REGISTRATION</h1>
          
          <h2>SIGN UP</h2>

          <p>Your career of choice begins here, register yourself and within 24hrs to your email you'll receieve your Student Id Number which will enable you a seamless start.  </p>

          <img src="/pot/blockprint-lesson-arithmetic.svg" class="logo" alt="logo">
          

            
          <form action="signup" method="post">
               <div id="formContent"> 
                    <label for="idnumber">ID Number:</label>
                    <input type="text" id="idnumber" name="idnumber" required>
                    
          
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
               
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

               
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                   
                    <div class="button-wrap"> 
                         <button type="button" id="enterBtn">Enter</button>
                    </div>
               </div>             
               
          </form>
           <canvas id="confetti"></canvas>
           <h1 id="welcome"></h1>
          <script src="confetti.js"></script>
          <script src="Registration.js"></script>

     </body>
</html>
